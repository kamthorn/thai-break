name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dictionary:
    name: Dictionary copies in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check committed copies match data/
        run: tools/sync_dict.sh check

  php:
    name: PHP (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pcre, spl
          coverage: none

      - name: Install Composer dependencies
        run: composer update --prefer-dist --no-progress --no-interaction --with-all-dependencies

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --colors=always

      - name: Run Integration Test Suite
        run: php php/tests/TokenizerTest.php

      - name: Run Demo Script
        run: php php/examples/demo.php

  go:
    name: Go (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', '1.23', '1.24']
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}

      - name: Run Go Tests & Benchmarks
        run: |
          cd go
          go test -v ./...
          go test -bench=. ./...

  typescript:
    name: TypeScript / Node.js (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: |
          cd typescript
          npm ci

      - name: Build TypeScript
        run: |
          cd typescript
          npm run build

      - name: Run Node Tests
        run: |
          cd typescript
          npm test

  rust:
    name: Rust (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Run Rust Tests
        run: |
          cd rust
          cargo test --verbose

      - name: Build Release Library
        run: |
          cd rust
          cargo build --release --verbose

      - name: Package the crate and build it on its own
        run: |
          tools/sync_dict.sh stage
          cd rust
          cargo package --allow-dirty

  python:
    name: Python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust (for C-FFI core library)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Build Rust Shared Library
        run: |
          cd rust
          cargo build --release

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run Python Tests
        run: |
          cd python
          python3 -m unittest discover tests

      - name: Run Benchmark Tool Tests
        run: python3 -m unittest discover tools/tests
