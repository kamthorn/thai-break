[package]
name = "thaibreak"
version = "1.0.3"
edition = "2021"
authors = ["kamthorn"]
description = "Fast, high-accuracy Thai word segmentation and typographic line breaker core engine"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/kamthorn/thai-break"

[lib]
name = "thaibreak"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
regex = { version = "1.10", default-features = false, features = ["std", "unicode"] }
once_cell = "1.19"
libc = { version = "0.2", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
pyo3 = { version = "0.23", optional = true, features = ["extension-module"] }

[features]
default = ["c-ffi"]
c-ffi = ["dep:libc"]
wasm = ["dep:wasm-bindgen"]
python = ["dep:pyo3"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
