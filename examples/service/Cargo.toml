[package]
name = "thai-break-service"
version = "0.1.0"
edition = "2024"

[lib]
name = "thai_break_service"
path = "src/lib.rs"

[[bin]]
name = "thai-break-service"
path = "src/main.rs"


[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Core engine: the thai-break crate of this repository
thaibreak = { path = "../../rust", default-features = false }
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["limit", "util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "compression-full", "timeout", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

