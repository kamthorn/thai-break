[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thaibreak"
version = "1.2.0"
description = "Fast, high-accuracy Thai word segmentation and typographic line breaker"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "kamthorn" }]
license-files = ["LICENSE"]
keywords = ["thai", "word-segmentation", "line-break", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/kamthorn/thai-break"
Repository = "https://github.com/kamthorn/thai-break"


[tool.setuptools.packages.find]
where = ["."]
include = ["thaibreak*"]

[tool.setuptools.package-data]
thaibreak = ["_lib/*", "data/*"]
