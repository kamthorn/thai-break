[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thaibreak"
version = "1.0.0"
description = "Fast, high-accuracy Thai word segmentation and typographic line breaker"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "kamthorn" }]
keywords = ["thai", "word-segmentation", "line-break", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["thaibreak*"]
