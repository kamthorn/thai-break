[package]
name = "thaibreak"
version = "1.1.2"
edition = "2021"
authors = ["kamthorn"]
description = "Fast, high-accuracy Thai word segmentation and typographic line breaker core engine"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/kamthorn/thai-break"
include = [
    "src/**",
    "tests/**",
    "include/**",
    "build.rs",
    "data/words.fst",
    "README.md",
    "LICENSE",
]

[lib]
name = "thaibreak"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
regex = { version = "1.10", default-features = false, features = ["std", "unicode"] }
once_cell = "1.19"
fst = "0.4"
libc = { version = "0.2", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
pyo3 = { version = "0.23", optional = true, features = ["extension-module"] }
wasm-minimal-protocol = { version = "0.1", optional = true }

[features]
default = ["c-ffi", "embedded-dict"]
embedded-dict = []
c-ffi = ["dep:libc"]
wasm = ["dep:wasm-bindgen"]
python = ["dep:pyo3"]
typst-plugin = ["dep:wasm-minimal-protocol", "embedded-dict"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "thaibreak_compile_fst"
path = "src/bin/thaibreak_compile_fst.rs"
